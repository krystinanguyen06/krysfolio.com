
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2B262C">
  <title>Krystina | Visual Designer & Animator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="pitch-page">
    <video
      id="pitchVideo"
      class="pitch-video"
      playsinline
      preload="none"
      poster="images/hero-poster.jpeg"
      aria-label="Krystina's pitching video"
    >
      <source src="images/hero-animation.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>

    <header class="topbar">
      <a class="brand" href="index.html" aria-label="KRYSFOLIO home">
        <span class="logo-circle">hi</span>
        <span class="brand-name">KRYSFOLIO.COM</span>
      </a>

      <a class="contact-link" href="contact.html">
        CONTACT <span aria-hidden="true">↗</span>
      </a>
    </header>

    <div class="video-overlay" id="videoOverlay">
      <button class="play-button" id="playButton" type="button">
        <span class="play-icon" aria-hidden="true">▶</span>
        <span>WATCH MY PITCH</span>
      </button>
    </div>

    <section class="video-controls" id="videoControls"
             aria-label="Video controls" hidden>
      <button class="control-button" id="pauseButton" type="button"
              aria-label="Pause video">Ⅱ</button>

      <span class="time-display" id="currentTime">0:00</span>

      <input
        class="timeline"
        id="timeline"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Seek through video"
      >

      <span class="time-display" id="duration">0:00</span>

      <button class="control-button sound-button" id="soundButton"
              type="button" aria-label="Mute video">SOUND ON</button>
    </section>

    <p class="video-error" id="videoError" role="alert" hidden>
      Unable to play the video. Please try again.
    </p>
  </main>

</body>
</html>
